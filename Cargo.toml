[workspace]
members = [
    "crates/membrie-core",
    "crates/membrie-daemon",
    "crates/membrie-capture",
    "crates/membrie-a11y",
    "crates/membrie-app",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Chuk and Aster"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/chukrobertson/Membrie"

[workspace.dependencies]
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
uuid = { version = "1.24.0", features = ["serde", "v7"] }

[profile.release]
lto = "thin"
strip = "symbols"
